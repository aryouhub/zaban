<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <title>آموزش لغات انگلیسی</title>
    <link rel="icon" type="image/x-icon" href="/quran/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* استایل‌های پایه برای جلوگیری از فلاش */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      /* تم‌های مختلف */
      [data-theme="dark"] {
        background-color: #0f172a;
        color: #ffffff;
      }
      [data-theme="light"] {
        background-color: #f8fafc;
        color: #0f172a;
      }
      [data-theme="warm"] {
        background-color: #1c1917;
        color: #fef3c7;
      }
      [data-theme="high-contrast"] {
        background-color: #000000;
        color: #ffffff;
      }
    </style>
    <script>
      // اعمال تم قبل از بارگذاری React برای جلوگیری از فلاش
      (function () {
        try {
          const saved = localStorage.getItem('theme-mode');
          let theme = 'dark';
          if (saved === 'light') theme = 'light';
          else if (saved === 'warm') theme = 'warm';
          else if (saved === 'high-contrast') theme = 'high-contrast';
          else if (saved === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }

        // پشتیبانی از iframe
        const isInIframe = window.self !== window.top;
        if (isInIframe) {
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (['dark', 'light', 'warm', 'high-contrast'].includes(theme)) {
                document.documentElement.setAttribute('data-theme', theme);
              }
            }
          });
        }
      })();
    </script>
      <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          // 资源加载失败的 error 事件没有 message，此处仅上报 JS 运行时错误
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return; // 相同错误只上报一次，避免渲染循环刷屏
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : ""
                }
              },
              "*"
            );
          } catch (e) {
            /* 上报失败不影响页面运行 */
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
